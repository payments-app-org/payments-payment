server:
  port: 8083

spring:
  application:
    name: payment
  # Тайм-ауты всех HTTP-клиентов по умолчанию: зависший сосед не держит поток бесконечно
  http:
    clients:
      connect-timeout: ${HTTP_CONNECT_TIMEOUT:1s}
      read-timeout: ${HTTP_READ_TIMEOUT:5s}
    # HTTP-клиенты соседей (интерфейсы @HttpExchange): адрес и тайм-ауты по группам
    serviceclient:
      account:
        base-url: ${ACCOUNT_URL:http://localhost:8081}
        connect-timeout: 1s
        read-timeout: 3s
      fraud:
        base-url: ${FRAUD_URL:http://localhost:8084}
        connect-timeout: 1s
        read-timeout: 2s
      processing:
        base-url: ${PROCESSING_URL:http://localhost:8085}
        connect-timeout: 1s
        read-timeout: 3s
      biller:
        base-url: ${BILLER_URL:http://localhost:8087}
        connect-timeout: 1s
        read-timeout: 3s
  # Сага ждёт ответы других сервисов — на виртуальных потоках это дёшево
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${DB_USER:payments}
    password: ${DB_PASSWORD:payments}
    # search_path соединения — своя схема, в том числе для нативных SQL-запросов
    hikari:
      schema: payment
  # У каждого сервиса своя схема в общей базе (создаётся в infra/postgres/init.sql)
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: payment
    liquibase-schema: payment
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    producer:
      acks: all
  # Redis: блокировки планировщиков (ShedLock), кэш
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis недоступен — отказ за секунды (кэш идёт мимо, readiness — DOWN), а не ожидание по минуте
      connect-timeout: 1s
      timeout: 2s
      # Redis — только для кэша и блокировок, репозитории Spring Data на нём не нужны
      repositories:
        enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: payment

# Отказоустойчивость вызовов соседей (libs/platform ResilientCalls). Повторяем только идемпотентные вызовы;
# 4xx — бизнес-ответ, не сбой: не повторяем и не считаем в circuit breaker.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
    instances:
      account: { base-config: default }
      fraud: { base-config: default }
      processing: { base-config: default }
      biller: { base-config: default }
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
      # Неидемпотентные вызовы (перевод, оплата у поставщика): только если не удалось соединиться
      connect-only:
        max-attempts: 2
        wait-duration: 200ms
        retry-exception-predicate: com.paymentsapp.platform.resilience.ConnectFailure
    instances:
      account: { base-config: default }
      fraud: { base-config: default, max-attempts: 2 }
      processing: { base-config: default }
      biller: { base-config: default }
      processing-connect-only: { base-config: connect-only }
      biller-connect-only: { base-config: connect-only }
  bulkhead:
    configs:
      default:
        # Не больше стольких одновременных вызовов соседа: виртуальные потоки иначе завалят упавший сервис
        max-concurrent-calls: 50
        max-wait-duration: 100ms
    instances:
      account: { base-config: default }
      fraud: { base-config: default }
      processing: { base-config: default }
      biller: { base-config: default }

# Общий с pricing секрет для проверки котировок
quote:
  # Только из окружения: значения по умолчанию у секрета нет
  secret: ${QUOTE_SECRET}

payment:
  # Минимальная сумма любого платежа, ₽
  min-amount: 10
  requisites:
    # БИК нашего банка
    our-bik: "044525999"
  # «Округление на пользу»: оплата по реквизитам и услуги этих групп поставщиков
  roundup:
    types: [REQUISITES, REQUISITES_OUR]
    bill-groups: [MOBILE, GAMES, UTILITIES, GOV, INTERNET, EDUCATION, SHOPS, TRAVEL, INSURANCE, SECURITY]
  # Ключи идемпотентности: сколько хранить (дольше, чем клиент может повторять запрос) и как часто чистить.
  # Удаляем пачками, чтобы не держать долгую блокировку таблицы
  idempotency:
    retention: 24h
    cleanup-interval: 1h
    cleanup-batch: 1000
  # Пожертвования: biller переводит фондам сам в конце дня — без шлюза поставщика
  settlement:
    deferred-groups: [DONATIONS]
  # RecoveryJob: интервал, через сколько платёж в статусе считается зависшим, размер пачки
  recovery:
    interval: 10s
    confirm-after: 10s
    release-after: 10s
    processing-after: 30s
    # Долгий перевод (ACCEPTED): итог процессинг пришлёт сам; спрашиваем не чаще раза в столько — на случай,
    # если уведомление потерялось
    accepted-check-after: 1m
    interrupted-after: 60s
    batch-size: 50

# Общая библиотека libs/platform
platform:
  # Swagger: описание API и коды ошибок в схеме Problem
  openapi:
    description: "Платежи: приём, сага, статусы"
    error-codes: com.paymentsapp.payment.error.PaymentError
  time:
    zone: Europe/Moscow
  outbox:
    enabled: true
    publish-interval: 1s
    retention: 7d

messaging:
  payment-events:
    topic: payment.events
    partitions: 3
    replicas: 1

# Actuator: /actuator/health — liveness (процесс жив) и readiness (готов принимать запросы: есть БД и Redis);
# по ним healthcheck в compose и пробы Kubernetes. Остановка — плавная (по умолчанию в Spring Boot): новые запросы
# не принимаем, текущие дорабатывают
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis

springdoc:
  # Swagger UI и спецификация включены; в проде можно выключить: SWAGGER_ENABLED=false
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
