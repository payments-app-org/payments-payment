server:
  port: 8083

spring:
  application:
    name: payment
  # Тайм-ауты всех HTTP-клиентов по умолчанию: зависший сосед не держит поток бесконечно
  http:
    clients:
      connect-timeout: ${HTTP_CONNECT_TIMEOUT:1s}
      read-timeout: ${HTTP_READ_TIMEOUT:5s}
  # Сага ждёт ответы других сервисов — на виртуальных потоках это дёшево
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${DB_USER:payments}
    password: ${DB_PASSWORD:payments}
    # search_path соединения — своя схема, в том числе для нативных SQL-запросов
    hikari:
      schema: payment
  # У каждого сервиса своя схема в общей базе (создаётся в infra/postgres/init.sql)
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: payment
    liquibase-schema: payment
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    producer:
      acks: all
  # Redis: блокировки планировщиков (ShedLock), кэш
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis — только для кэша и блокировок, репозитории Spring Data на нём не нужны
      repositories:
        enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: payment

clients:
  account:
    url: ${ACCOUNT_URL:http://localhost:8081}
    timeout: 3s
  fraud:
    url: ${FRAUD_URL:http://localhost:8084}
    timeout: 2s
  processing:
    url: ${PROCESSING_URL:http://localhost:8085}
    timeout: 3s
  biller:
    url: ${BILLER_URL:http://localhost:8087}
    timeout: 3s

# Общий с pricing секрет для проверки котировок
quote:
  secret: ${QUOTE_SECRET:local-dev-quote-secret-change-me}

recovery:
  interval: 10s

# Общая библиотека libs/platform
platform:
  time:
    zone: Europe/Moscow
  outbox:
    enabled: true
    publish-interval: 1s
    retention: 7d

messaging:
  payment-events:
    topic: payment.events
    partitions: 3
    replicas: 1
